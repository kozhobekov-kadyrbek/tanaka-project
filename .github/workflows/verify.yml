name: Verify annual accounting

on:
  push:
  pull_request:

jobs:
  python-qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Reproduce complete public analysis package
        run: python src/python/generate_publication_outputs.py
      - name: Run public Python tests
        run: python -m unittest discover -s tests -p "test_python_reproduction.py"
